<style>
  :root{
    /* Paleta "Calma & Prosperidad" */
    --bg:#F7F9FA;              /* Blanco Hueso - fondo principal */
    --card:#ffffff;
    --border:#E1E7EC;
    --text:#1E2A38;            /* Azul Marino Suave - texto principal, encabezados */
    --sub:#5B7B9C;             /* Azul Muted - texto secundario */

    --accent:#1E2A38;          /* Azul Marino Suave - estado activo, botones primarios */
    --accent-bg:#E7EAED;

    --secondary:#5B7B9C;       /* Azul Muted - confianza, agenda, botones secundarios */
    --secondary-bg:#EAF1F6;

    --success:#87A987;         /* Verde Salvia - ahorro, metas, saldo positivo */
    --success-bg:#E9F1E9;

    --amber:#E07A5F;           /* Coral Apagado - recordatorios, fechas límite, gastos */
    --amber-bg:#FBEEE9;
    --danger:#C0503A;          /* Coral oscurecido - estados críticos / error */
    --danger-bg:#F8E2DC;

    --blue:#5B7B9C; --blue-bg:#EAF1F6; /* alias de --secondary, compatibilidad */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text);}
  .app{max-width:480px; margin:0 auto; padding:16px; padding-bottom:90px;}
  h1{font-size:20px; font-weight:600; margin:4px 0 14px;}
  .tabs{display:flex; gap:5px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:16px; overflow-x:auto;}
  .tab{flex:1; text-align:center; padding:9px 3px; border-radius:9px; font-size:12px; font-weight:600; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--accent); color:#fff;}

  .alert-banner{display:flex; align-items:center; gap:10px; background:var(--danger-bg); color:var(--danger); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:13px; font-weight:500;}
  .alert-banner.warn{background:var(--amber-bg); color:var(--amber);}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .stat .label{font-size:12px; color:var(--sub); margin-bottom:4px;}
  .stat .value{font-size:22px; font-weight:600;}
  .stat.over .value{color:var(--danger);}
  .stat.positive .value{color:var(--success);}
  .budget-bar{height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:8px;}
  .budget-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .3s;}
  .budget-fill.warn{background:var(--amber);}
  .budget-fill.over{background:var(--danger);}
  .budget-fill.good{background:var(--success);}

  .section-title{font-size:13px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.3px; margin:20px 0 10px;}
  .cat-grid, .list{display:flex; flex-direction:column; gap:8px;}
  .cat-row{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px;}
  .cat-row .name{display:flex; align-items:center; gap:8px; font-size:14px;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .cat-row .amt{font-size:14px; font-weight:600;}

  .item-wrap{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .item{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer;}
  .item .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .item .icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .item .meta{min-width:0;}
  .item .meta .desc{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item .meta .sub{font-size:12px; color:var(--sub);}
  .item .right{display:flex; align-items:center; gap:2px; flex-shrink:0;}
  .item .amount{font-size:14px; font-weight:600; white-space:nowrap;}
  .item .del{background:none; border:none; color:var(--sub); font-size:15px; padding:4px 6px; cursor:pointer; margin-left:2px;}
  .item .chevron{font-size:11px; color:var(--sub); margin-left:4px; transition:transform .2s; display:inline-block;}
  .item .chevron.open{transform:rotate(180deg);}
  .detail-panel{padding:2px 14px 14px 60px; border-top:1px solid var(--border); background:var(--bg);}
  .detail-row{display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid var(--border);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--sub);}
  .detail-row .v{font-weight:500; text-align:right; max-width:65%;}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:26px 0;}

  .bars{display:flex; flex-direction:column; gap:12px;}
  .bar-row{display:flex; flex-direction:column; gap:5px;}
  .bar-top{display:flex; justify-content:space-between; align-items:baseline; font-size:13px;}
  .bar-label{font-weight:500;}
  .bar-amt{color:var(--sub); font-weight:500; flex-shrink:0;}
  .bar-track{height:10px; background:var(--border); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px; transition:width .3s;}
  .bar-pct{font-size:11px; color:var(--sub);}
  .salary-row{display:flex; gap:8px; margin-bottom:16px;}
  .salary-row input{flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:var(--card); color:var(--text);}
  .salary-row button{flex:0 0 auto; padding:0 18px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer;}
  .pct-input-wrap{position:relative; flex:1;}
  .pct-input-wrap input{width:100%; padding:10px 32px 10px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:var(--card); color:var(--text);}
  .pct-suffix{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--accent); font-weight:700; font-size:15px; pointer-events:none;}
  .goal-hint{margin:-6px 0 14px 2px; color:var(--sub); font-size:12px;}
  .market-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:6px 14px; margin-bottom:10px;}
  .market-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
  .market-row:not(:last-child){border-bottom:1px solid var(--border);}
  .market-name{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500;}
  .market-name img{width:22px; height:22px; border-radius:50%;}
  .market-price{text-align:right;}
  .market-price .p{font-size:14px; font-weight:600;}
  .market-price .chg{font-size:11px; font-weight:600;}
  .chg.up{color:var(--success);}
  .chg.down{color:var(--danger);}
  .market-updated{display:flex; align-items:center; justify-content:flex-end; gap:10px; font-size:11px; color:var(--sub); margin-bottom:6px;}
  .market-refresh{background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer;}

  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px;}
  .chip{flex-shrink:0; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:12px; font-weight:500; cursor:pointer; white-space:nowrap;}
  .chip.sel{background:var(--secondary); color:#fff; border-color:var(--secondary);}

  .fab{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:448px; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:600; cursor:pointer;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:10;}
  .modal{background:var(--card); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:85vh; overflow-y:auto;}
  .modal h2{font-size:17px; font-weight:600; margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px;}
  .field input, .field select{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:var(--bg); color:var(--text);}
  .pick-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .pick-btn{padding:10px 4px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg); font-size:12px; text-align:center; cursor:pointer;}
  .pick-btn.sel{border-color:var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:13px; border-radius:12px; border:1px solid var(--secondary); background:var(--bg); color:var(--secondary); font-size:15px; font-weight:600; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#fff; border:none;}
  .error{color:var(--danger); font-size:12px; margin-top:4px;}

  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-header .month{font-size:16px; font-weight:600; text-transform:capitalize;}
  .cal-nav{background:var(--card); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; font-size:15px; cursor:pointer;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--sub); font-weight:600; padding:4px 0;}
  .cal-day{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-size:13px; cursor:pointer; position:relative; background:var(--card); border:1px solid var(--border);}
  .cal-day.empty{visibility:hidden; cursor:default;}
  .cal-day.today{border-color:var(--accent); border-width:1.5px;}
  .cal-day.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cal-day .dots{display:flex; gap:2px; margin-top:2px;}
  .cal-day .dots span{width:4px; height:4px; border-radius:50%;}

  /* Auth screens */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .topbar h1{margin:0; display:flex; align-items:center;}
  .icon{width:30px; height:30px; flex-shrink:0; vertical-align:middle; margin-right:8px;}
  
  .icon-btn{background:var(--card); border:1px solid var(--border); width:36px; height:36px; border-radius:10px; font-size:15px; cursor:pointer; flex-shrink:0;}
  .auth-wrap{min-height:80vh; display:flex; flex-direction:column; justify-content:center; padding:20px 4px;}
  .auth-title{font-size:22px; font-weight:700; text-align:center; margin-bottom:4px;}
  .auth-sub{font-size:14px; color:var(--sub); text-align:center; margin-bottom:28px;}
  .auth-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px;}
  .pin-dots{display:flex; justify-content:center; gap:16px; margin:10px 0 26px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--border); background:transparent; transition:all .15s;}
  .pin-dot.filled{background:var(--accent); border-color:var(--accent);}
  .pin-dot.error{background:var(--danger); border-color:var(--danger);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .key{aspect-ratio:1; border-radius:50%; border:1px solid var(--border); background:var(--card); font-size:20px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .key:active{background:var(--bg);}
  .key.ghost{background:transparent; border:none; cursor:default;}
  .auth-error{color:var(--danger); font-size:13px; text-align:center; min-height:18px; margin-bottom:6px;}
  .bio-btn{width:100%; padding:13px; border-radius:12px; border:1px solid var(--accent); background:var(--accent-bg); color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .auth-link{display:block; text-align:center; font-size:12px; color:var(--sub); margin-top:18px; cursor:pointer; text-decoration:underline;}
  .auth-name{font-size:17px; font-weight:600; text-align:center; margin-bottom:2px;}
</style>

/* ---------- Almacenamiento portable ---------- */
/* Usa window.storage (Claude Artifacts) si existe; si no, cae a localStorage (GitHub Pages / navegador normal) */
const storage = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{ return await window.storage.get(key); }catch(e){ /* sigue con localStorage */ }
    }
    try{
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      try{ return await window.storage.set(key, value); }catch(e){ /* sigue con localStorage */ }
    }
    try{
      localStorage.setItem(key, value);
      return { key, value };
    }catch(e){ return null; }
  }
};

function fmt(n){ return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n); }
function fmtUsd(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n); }
function catInfo(id){ return EXP_CATS.find(c=>c.id===id) || EXP_CATS[EXP_CATS.length-1]; }
function evtTypeInfo(id){ return EVT_TYPES.find(t=>t.id===id) || EVT_TYPES[EVT_TYPES.length-1]; }
function personInfo(id){ return state.people.find(p=>p.id===id); }
function personColor(id){ const i = state.people.findIndex(p=>p.id===id); return PEOPLE_COLORS[i % PEOPLE_COLORS.length] || '#5f5e5a'; }

/* ---------- Storage ---------- */
async function loadData(){
  try{
    const r = await storage.get('hogar-data');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      state.expenses = parsed.expenses || [];
      state.budget = parsed.budget ?? 300000;
      state.salary = parsed.salary ?? 0;
      state.savingsGoalPct = parsed.savingsGoalPct ?? 20;
      state.people = parsed.people && parsed.people.length ? parsed.people : state.people;
      state.events = parsed.events || [];
      state.credits = parsed.credits || [];
      state.n8nWebhookUrl = parsed.n8nWebhookUrl || '';
      state.user = parsed.user || null;
    }
  }catch(e){ /* first run */ }
  state.loaded = true;
  authStep = state.user ? 'login' : 'reg-name';
  try{
    bioAvailable = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ bioAvailable = false; }
  render();
}
async function saveData(){
  try{
    await storage.set('hogar-data', JSON.stringify({
      expenses: state.expenses, budget: state.budget, salary: state.salary, savingsGoalPct: state.savingsGoalPct, people: state.people, events: state.events, credits: state.credits, user: state.user, n8nWebhookUrl: state.n8nWebhookUrl
    }));
  }catch(e){ console.error('save failed', e); }
}

function currentMonthExpenses(){
  const now = new Date().toISOString().slice(0,7);
  return state.expenses.filter(e => monthKey(e.date) === now);
}
function currentMonthEventCosts(){
  const now = new Date().toISOString().slice(0,7);
  return state.events.filter(e => e.cost && e.cost > 0 && monthKey(e.date) === now);
}
const CREDIT_COLOR = '#E07A5F';
function creditOccurrencesForMonth(year, month){
  const mKey = `${year}-${String(month+1).padStart(2,'0')}`;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  return state.credits.filter(c => c.autoRepeat || c.createdMonth === mKey).map(c=>{
    const day = Math.min(c.payDay, daysInMonth);
    return { ...c, date: `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}` };
  });
}
function currentMonthCredits(){
  const now = new Date();
  return creditOccurrencesForMonth(now.getFullYear(), now.getMonth());
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function upcomingEvents(){
  const today = todayStr();
  return state.events.filter(e => e.date >= today).sort((a,b)=> (a.date+ (a.time||'')).localeCompare(b.date+(b.time||'')));
}
function eventsOnDate(d){
  return state.events.filter(e=>e.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}

/* ---------- Cotizaciones (dólar y cripto) ---------- */
async function ensureMarketData(force){
  const stale = (Date.now() - market.updatedAt) > MARKET_REFRESH_MS;
  if(market.loading || (!force && !stale && market.updatedAt > 0)) return;
  market.loading = true; market.error = false; render();
  try{
    const [usdRes, cryptoRes] = await Promise.all([
      fetch('https://dolarapi.com/v1/dolares/blue').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false&price_change_percentage=24h')
        .then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(usdRes) market.usd = usdRes;
    if(cryptoRes && Array.isArray(cryptoRes)){
      const stablecoins = ['usdt','usdc','dai','busd','tusd','fdusd'];
      market.crypto = cryptoRes.filter(c=>!stablecoins.includes(c.symbol)).slice(0,3);
    }
    market.error = !usdRes && !(cryptoRes && cryptoRes.length);
    market.updatedAt = Date.now();
  }catch(e){
    market.error = true;
  }
  market.loading = false;
  render();
}
function refreshMarket(){ ensureMarketData(true); }

/* ---------- AUTENTICACIÓN ---------- */
function pinDotsHtml(len, filled, hasError){
  let html = '';
  for(let i=0;i<len;i++){
    html += `<div class="pin-dot ${i<filled?'filled':''} ${hasError?'error':''}"></div>`;
  }
  return html;
}
function keypadHtml(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  return `<div class="keypad">${keys.map(k=>{
    if(k===''){ return `<div class="key ghost"></div>`; }
    if(k==='⌫'){ return `<button class="key" onclick="pinBackspace()">⌫</button>`; }
    return `<button class="key" onclick="pinPress('${k}')">${k}</button>`;
  }).join('')}</div>`;
}

function pinPress(d){
  if(pinBuffer.length >= 4) return;
  pinBuffer += d;
  authError = '';
  render();
  if(pinBuffer.length === 4){
    setTimeout(()=>{
      if(authStep === 'login') checkLogin();
      else if(authStep === 'reg-pin') confirmPinStep();
      else if(authStep === 'reg-confirm') finishPinConfirm();
    }, 120);
  }
}
function pinBackspace(){ pinBuffer = pinBuffer.slice(0,-1); authError=''; render(); }

function goToPinStep(){
  const el = document.getElementById('inp-reg-name');
  const name = el.value.trim();
  if(!name){ el.style.borderColor = 'var(--danger)'; return; }
  regName = name;
  pinBuffer = '';
  authError = '';
  authStep = 'reg-pin';
  render();
}
function confirmPinStep(){
  regPin = pinBuffer;
  pinBuffer = '';
  authStep = 'reg-confirm';
  render();
}
function finishPinConfirm(){
  if(pinBuffer !== regPin){
    authError = 'Las claves no coinciden, probá de nuevo';
    pinBuffer = '';
    regPin = '';
    setTimeout(()=>{ authStep = 'reg-pin'; render(); }, 700);
    render();
    return;
  }
  state.user = { name: regName, pin: regPin, biometricEnabled: false, biometricCredId: null };
  pinBuffer = '';
  authStep = 'reg-biometric';
  render();
}
async function setupBiometric(){
  const ok = await registerBiometricCredential(state.user.name);
  if(ok){
    state.user.biometricEnabled = true;
  } else {
    authError = 'No se pudo activar la huella. Podés intentarlo después.';
  }
  finishRegistration();
}
function finishRegistration(){
  saveData();
  unlocked = true;
  authError = '';
  render();
}

/* --- Biometría (WebAuthn, verificación local del dispositivo) --- */
function bufToB64(buf){
  const bytes = new Uint8Array(buf); let bin = '';
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}
function b64ToBuf(b64){
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function registerBiometricCredential(name){
  try{
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16); crypto.getRandomValues(userId);
    const cred = await navigator.credentials.create({ publicKey: {
      challenge, rp:{name:'Hogar'}, user:{id:userId, name, displayName:name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'},
      timeout:60000
    }});
    if(cred){ state.user.biometricCredId = bufToB64(cred.rawId); return true; }
  }catch(e){ console.error('biometric register failed', e); }
  return false;
}
async function verifyBiometricCredential(){
  try{
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    const credId = b64ToBuf(state.user.biometricCredId);
    const assertion = await navigator.credentials.get({ publicKey:{
      challenge, allowCredentials:[{id:credId, type:'public-key'}], userVerification:'required', timeout:60000
    }});
    return !!assertion;
  }catch(e){ console.error('biometric verify failed', e); return false; }
}

function renderGastos(){
  const monthExp = currentMonthExpenses().sort((a,b)=> b.date.localeCompare(a.date));
  const dailyTotal = monthExp.reduce((s,e)=>s+e.amount,0);
  const agendaCosts = currentMonthEventCosts();
  const agendaTotal = agendaCosts.reduce((s,e)=>s+e.cost,0);
  const monthCredits = currentMonthCredits().sort((a,b)=>a.payDay-b.payDay);
  const creditsTotal = monthCredits.reduce((s,c)=>s+c.amount,0);
  const total = dailyTotal + agendaTotal + creditsTotal;
  const pct = state.budget > 0 ? Math.round((total/state.budget)*100) : 0;
  const over = total > state.budget;
  const nearLimit = pct >= 90 && !over;
  const salary = state.salary || 0;
  const disponible = salary - total;

  const byCat = {};
  monthExp.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([catId, amt])=>{
    const c = catInfo(catId);
    return `<div class="cat-row">
      <div class="name"><span class="dot" style="background:${c.color}"></span>${c.icon} ${c.name}</div>
      <div class="amt">${fmt(amt)}</div>
    </div>`;
  }).join('') || '';
  const agendaCatRow = agendaTotal > 0
    ? `<div class="cat-row"><div class="name"><span class="dot" style="background:#5f5e5a"></span>🎒 Actividades extracurriculares</div><div class="amt">${fmt(agendaTotal)}</div></div>`
    : '';
  const creditsCatRow = creditsTotal > 0
    ? `<div class="cat-row"><div class="name"><span class="dot" style="background:${CREDIT_COLOR}"></span>🏦 Créditos y pagos fijos</div><div class="amt">${fmt(creditsTotal)}</div></div>`
    : '';
  const catRowsFinal = (catRows + agendaCatRow + creditsCatRow) || '<div class="empty">Todavía no cargaste gastos este mes.</div>';

  const itemsHtml = monthExp.slice(0,30).map(e=>{
    const c = catInfo(e.category);
    const d = new Date(e.date+'T00:00:00');
    const dateStr = d.toLocaleDateString('es-AR',{day:'2-digit', month:'short'});
    const dateFull = d.toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const open = expandedExpense === e.id;
    return `<div class="item-wrap" data-date="${e.date}">
      <div class="item" onclick="toggleExpense('${e.id}')">

          <div class="icon" style="background:${c.bg}">${c.icon}</div>

            <div class="sub">${dateStr}</div>
          </div>
        </div>
        <div class="right">
          <div class="amount">${fmt(e.amount)}</div>
          <span class="chevron ${open?'open':''}">▾</span>
          <button class="del" aria-label="Eliminar" onclick="event.stopPropagation(); deleteExpense('${e.id}')">✕</button>
        </div>
      </div>
      ${open ? `<div class="detail-panel">
        <div class="detail-row"><span class="k">Monto</span><span class="v">${fmt(e.amount)}</span></div>
        <div class="detail-row"><span class="k">Categoría</span><span class="v">${c.icon} ${c.name}</span></div>
        <div class="detail-row"><span class="k">Fecha</span><span class="v" style="text-transform:capitalize">${dateFull}</span></div>
        <div class="detail-row"><span class="k">Descripción</span><span class="v">${e.note || '—'}</span></div>
      </div>` : ''}
    </div>`;
  });

  const agendaItemsHtml = agendaCosts.slice(0,20).map(e=>{
    const t = evtTypeInfo(e.type);
    const p = personInfo(e.person);
    const d = new Date(e.date+'T00:00:00');
    const dateStr = d.toLocaleDateString('es-AR',{day:'2-digit', month:'short'});
    return { date: e.date, html: `<div class="item-wrap" data-date="${e.date}">

      </div>

        <div class="value">${salary>0?fmt(disponible):'—'}</div>

function renderAgenda(){
  const chips = `<div class="chips">
    <div class="chip ${agendaFilterPerson==='todos'?'sel':''}" onclick="setAgendaFilter('todos')">Todos</div>
    ${state.people.map(p=>`<div class="chip ${agendaFilterPerson===p.id?'sel':''}" onclick="setAgendaFilter('${p.id}')">${p.name}</div>`).join('')}
    <div class="chip" onclick="openPersonModal()">+ Persona</div>
  </div>`;

  let evts = upcomingEvents();
  if(agendaFilterPerson !== 'todos') evts = evts.filter(e=>e.person===agendaFilterPerson);

  const itemsHtml = evts.slice(0,50).map(e=>{
    const t = evtTypeInfo(e.type);
    const p = personInfo(e.person);
    const d = new Date(e.date+'T00:00:00');
    const dateStr = d.toLocaleDateString('es-AR',{weekday:'short', day:'2-digit', month:'short'});
    const dateFull = d.toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
    const open = expandedEvent === e.id;
    return `<div class="item-wrap">
      <div class="item" onclick="toggleEvent('${e.id}')">
        <div class="left">
          <div class="icon" style="background:${t.bg}">${t.icon}</div>
          <div class="meta">
            <div class="desc">${e.title}</div>
            <div class="sub">${dateStr}${e.time?' · '+e.time:''}${p?' · '+p.name:''}${e.cost?' · '+fmt(e.cost):''}</div>
          </div>
        </div>
        <div class="right">
          <span class="chevron ${open?'open':''}">▾</span>
          <button class="del" aria-label="Eliminar" onclick="event.stopPropagation(); deleteEvent('${e.id}')">✕</button>
        </div>
      </div>
      ${open ? `<div class="detail-panel">
        <div class="detail-row"><span class="k">Título</span><span class="v">${e.title}</span></div>
        <div class="detail-row"><span class="k">Tipo</span><span class="v">${t.icon} ${t.name}</span></div>
        <div class="detail-row"><span class="k">Fecha</span><span class="v" style="text-transform:capitalize">${dateFull}</span></div>
        <div class="detail-row"><span class="k">Hora</span><span class="v">${e.time || '—'}</span></div>
        <div class="detail-row"><span class="k">Persona</span><span class="v">${p ? p.name : '—'}</span></div>
        <div class="detail-row"><span class="k">Costo</span><span class="v">${e.cost ? fmt(e.cost) : '—'}</span></div>
        <div class="detail-row"><span class="k">Notas</span><span class="v">${e.notes || '—'}</span></div>
      </div>` : ''}
    </div>`;
  }).join('') || '<div class="empty">No hay actividades próximas. Agregá reuniones, pagos, cursos o deportes.</div>';

  return `
    ${chips}
    <div class="section-title">Próximas actividades</div>
    <div class="list">${itemsHtml}</div>
  `;
}
function setAgendaFilter(id){ agendaFilterPerson = id; render(); }

function openPersonModal(){
  const name = prompt('Nombre de la persona:');
  if(name && name.trim()){
    state.people.push({id:'p'+Date.now().toString(36), name:name.trim()});
    saveData(); render();
  }
}

function renderEventModal(){
  const typeBtns = EVT_TYPES.map(t=>`<div class="pick-btn ${t.id===formEvtType?'sel':''}" onclick="selectEvtType('${t.id}')">${t.icon}<br>${t.name}</div>`).join('');
  const peopleOpts = state.people.map(p=>`<option value="${p.id}" ${p.id===formPerson?'selected':''}>${p.name}</option>`).join('');
  return `
  <div class="modal-overlay" onclick="closeModalBg(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Nueva actividad</h2>
      <div class="field">
        <label>Título</label>
        <input type="text" id="inp-title" placeholder="Ej: Reunión de padres 3°B">
        <div class="error" id="err-title" style="display:none"></div>
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="inp-evt-date" value="${calSelectedDate}">
      </div>
      <div class="field">
        <label>Hora (opcional)</label>
        <input type="time" id="inp-evt-time">
      </div>
      <div class="field">
        <label>Persona</label>
        <select id="inp-person">${peopleOpts}</select>
      </div>
      <div class="field">
        <label>Costo (opcional, si la actividad implica un gasto)</label>
        <input type="number" id="inp-evt-cost" placeholder="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>Tipo</label>
        <div class="pick-grid">${typeBtns}</div>
      </div>
      <div class="field">
        <label>Notas (opcional)</label>
        <input type="text" id="inp-evt-notes" placeholder="Ej: Llevar cuaderno de comunicaciones">
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="submitEvent()">Guardar</button>
      </div>
    </div>
  </div>`;
}
function selectEvtType(id){ formEvtType = id; render(); }
function submitEvent(){
  const titleEl = document.getElementById('inp-title');
  const dateEl = document.getElementById('inp-evt-date');
  const timeEl = document.getElementById('inp-evt-time');
  const personEl = document.getElementById('inp-person');
  const notesEl = document.getElementById('inp-evt-notes');
  const costEl = document.getElementById('inp-evt-cost');
  const errEl = document.getElementById('err-title');
  if(!titleEl.value.trim()){
    errEl.textContent = 'Ingresá un título para la actividad';
    errEl.style.display = 'block';
    return;
  }
  const cost = parseFloat(costEl.value);
  const newEvent = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    title: titleEl.value.trim(), date: dateEl.value || todayStr(), time: timeEl.value || '',
    person: personEl.value, type: formEvtType, notes: notesEl.value.trim(), cost: (!isNaN(cost) && cost>0) ? cost : 0
  };
  state.events.push(newEvent);
  saveData(); modalOpen = null; render();
  const p = personInfo(newEvent.person);
  sendToN8n({
    tipo: 'actividad', titulo: newEvent.title, fecha: newEvent.date, hora: newEvent.time,
    persona: p ? p.name : '', tipoActividad: evtTypeInfo(newEvent.type).name, costo: newEvent.cost, notas: newEvent.notes
  });
}
function deleteEvent(id){ state.events = state.events.filter(e=>e.id!==id); saveData(); render(); }
function toggleEvent(id){ expandedEvent = expandedEvent === id ? null : id; render(); }

function openCreditModal(){
  modalOpen = 'credit';
  formCreditAuto = true;
  render();
}
function renderCreditModal(){
  return `
  <div class="modal-overlay" onclick="closeModalBg(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Nuevo crédito o pago fijo</h2>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="inp-credit-name" placeholder="Ej: Tarjeta Visa, Préstamo personal">
        <div class="error" id="err-credit-name" style="display:none"></div>
      </div>
      <div class="field">
        <label>Monto de la cuota</label>
        <input type="number" id="inp-credit-amount" placeholder="0" inputmode="numeric">
        <div class="error" id="err-credit-amount" style="display:none"></div>
      </div>
      <div class="field">
        <label>Día de pago (del 1 al 31)</label>
        <input type="number" id="inp-credit-day" placeholder="Ej: 10" min="1" max="31" inputmode="numeric">
        <div class="error" id="err-credit-day" style="display:none"></div>
      </div>
      <div class="field">
        <label>¿Cómo lo querés cargar?</label>
        <div class="pick-grid" style="grid-template-columns:1fr 1fr;">
          <div class="pick-btn ${formCreditAuto ? 'sel' : ''}" onclick="setCreditAuto(true)">🔁<br>Se repite cada mes</div>
          <div class="pick-btn ${!formCreditAuto ? 'sel' : ''}" onclick="setCreditAuto(false)">✋<br>Solo este mes</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="submitCredit()">Guardar</button>
      </div>
    </div>
  </div>`;
}
function setCreditAuto(v){ formCreditAuto = v; render(); }
function submitCredit(){
  const nameEl = document.getElementById('inp-credit-name');
  const amountEl = document.getElementById('inp-credit-amount');
  const dayEl = document.getElementById('inp-credit-day');
  let ok = true;
  if(!nameEl.value.trim()){ document.getElementById('err-credit-name').textContent='Ingresá un nombre'; document.getElementById('err-credit-name').style.display='block'; ok=false; }
  const amount = parseFloat(amountEl.value);
  if(!amount || amount <= 0){ document.getElementById('err-credit-amount').textContent='Ingresá un monto válido'; document.getElementById('err-credit-amount').style.display='block'; ok=false; }
  const day = parseInt(dayEl.value, 10);
  if(!day || day < 1 || day > 31){ document.getElementById('err-credit-day').textContent='Ingresá un día entre 1 y 31'; document.getElementById('err-credit-day').style.display='block'; ok=false; }
  if(!ok) return;
  const now = new Date();
  const newCredit = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: nameEl.value.trim(), amount, payDay: day, autoRepeat: formCreditAuto,
    createdMonth: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`
  };
  state.credits.push(newCredit);
  saveData(); modalOpen = null; render();
  sendToN8n({
    tipo: 'credito', titulo: newCredit.name, monto: newCredit.amount,
    diaDePago: newCredit.payDay, recurrente: newCredit.autoRepeat
  });
}
function deleteCredit(id){ state.credits = state.credits.filter(c=>c.id!==id); saveData(); render(); }

/* ---------- AJUSTES / INTEGRACIÓN n8n ---------- */
function openSettings(){ modalOpen = 'settings'; render(); }
function renderSettingsModal(){
  return `
  <div class="modal-overlay" onclick="closeModalBg(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>⚙️ Ajustes</h2>
      <div class="field">
        <label>URL del Webhook de n8n (para recordatorios automáticos)</label>
        <input type="text" id="inp-webhook" placeholder="https://tu-cuenta.app.n8n.cloud/webhook/..." value="${state.n8nWebhookUrl || ''}">
        <div class="error" id="err-webhook" style="display:none"></div>
      </div>
      <div class="goal-hint" style="margin-bottom:14px;">Cada actividad de Agenda y cada crédito que cargues se va a enviar automáticamente a esta URL, para que n8n pueda avisarte por notificación cuando se acerque la fecha.</div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cerrar</button>
        <button class="btn primary" onclick="saveWebhookUrl()">Guardar</button>
      </div>
    </div>
  </div>`;
}
function saveWebhookUrl(){
  const el = document.getElementById('inp-webhook');
  const url = el.value.trim();
  if(url && !/^https?:\/\//.test(url)){
    document.getElementById('err-webhook').textContent = 'La URL debe empezar con http:// o https://';
    document.getElementById('err-webhook').style.display = 'block';
    return;
  }
  state.n8nWebhookUrl = url;
  saveData();
  modalOpen = null;
  render();
}
function sendToN8n(payload){
  if(!state.n8nWebhookUrl) return;
  fetch(state.n8nWebhookUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(()=>{ /* si falla el envío, no interrumpe el uso normal de la app */ });
}

/* ---------- CALENDARIO TAB ---------- */
function renderCalendario(){
  const first = new Date(calYear, calMonth, 1);
  const startWeekday = (first.getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('es-AR',{month:'long', year:'numeric'});
  const dows = ['L','M','M','J','V','S','D'];
  const monthCreditOccurrences = creditOccurrencesForMonth(calYear, calMonth);

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evts = eventsOnDate(dateStr);
    const creditsHere = monthCreditOccurrences.filter(c=>c.date===dateStr);
    const isToday = dateStr === todayStr();
    const isSel = dateStr === calSelectedDate;
    const dots = evts.slice(0,3).map(e=>`<span style="background:${evtTypeInfo(e.type).color}"></span>`).join('')
      + creditsHere.slice(0,2).map(()=>`<span style="background:${CREDIT_COLOR}"></span>`).join('');
    cells += `<div class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" onclick="selectCalDate('${dateStr}')">
      ${d}<div class="dots">${dots}</div>
    </div>`;
  }

  const dayEvts = eventsOnDate(calSelectedDate);
  const dayCredits = monthCreditOccurrences.filter(c=>c.date===calSelectedDate);
  const selLabel = new Date(calSelectedDate+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long'});
  const evtListHtml = dayEvts.map(e=>{
    const t = evtTypeInfo(e.type);
    const p = personInfo(e.person);
    return `<div class="item">
      <div class="left">
        <div class="icon" style="background:${t.bg}">${t.icon}</div>
        <div class="meta">
          <div class="desc">${e.title}</div>
          <div class="sub">${e.time?e.time+' · ':''}${p?p.name:''}</div>
        </div>
      </div>
      <button class="del" aria-label="Eliminar" onclick="deleteEvent('${e.id}')">✕</button>
    </div>`;
  }).join('');
  const creditListHtml = dayCredits.map(c=>{
    return `<div class="item" onclick="setTab('gastos')">
      <div class="left">
        <div class="icon" style="background:${CREDIT_COLOR}22">🏦</div>
        <div class="meta">
          <div class="desc">${c.name}</div>
          <div class="sub">${fmt(c.amount)} · ${c.autoRepeat ? 'pago recurrente' : 'pago único este mes'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  const dayList = (evtListHtml + creditListHtml) || '<div class="empty">Sin actividades este día.</div>';

  return `
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrev()">‹</button>
      <div class="month">${monthLabel}</div>
      <button class="cal-nav" onclick="calNext()">›</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="section-title" style="text-transform:capitalize;">${selLabel}</div>
    <div class="list">${dayList}</div>
  `;
}
function calPrev(){ calMonth--; if(calMonth<0){calMonth=11; calYear--;} render(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0; calYear++;} render(); }
function selectCalDate(d){ calSelectedDate = d; render(); }

/* ---------- AHORRO TAB ---------- */
function renderAhorro(){
  const monthExp = currentMonthExpenses();
  const totalExp = monthExp.reduce((s,e)=>s+e.amount,0);
  const agendaCosts = currentMonthEventCosts();
  const totalAgenda = agendaCosts.reduce((s,e)=>s+e.cost,0);
  const monthCredits = currentMonthCredits();
  const totalCreditos = monthCredits.reduce((s,c)=>s+c.amount,0);
  const totalGasto = totalExp + totalAgenda + totalCreditos;
  const salary = state.salary || 0;
  const ahorro = salary - totalGasto;
  const pctGasto = salary > 0 ? Math.round((totalGasto/salary)*100) : 0;
  const pctAhorro = salary > 0 ? Math.max(0, 100 - pctGasto) : 0;
  const goalPct = state.savingsGoalPct ?? 20;
  const goalAmt = salary * (goalPct/100);
  const disponibleParaGastar = salary - goalAmt;
  const onTrack = ahorro >= goalAmt;

  let alert = '';
  if(salary <= 0){
    alert = `<div class="alert-banner warn">🔔 Cargá tu sueldo mensual para calcular cuánto podés ahorrar.</div>`;
  } else if(ahorro < 0){
    alert = `<div class="alert-banner">⚠️ Este mes gastaste ${fmt(Math.abs(ahorro))} más de lo que ganás.</div>`;
  } else if(!onTrack){
    alert = `<div class="alert-banner warn">🔔 Vas ${fmt(goalAmt - ahorro)} por debajo de tu meta de ahorro del ${goalPct}%.</div>`;
  }

  // combinar categorías de gastos + costos de agenda + créditos para el gráfico
  const byKey = {};
  monthExp.forEach(e=>{
    const k = 'exp-'+e.category;
    byKey[k] = byKey[k] || {icon:catInfo(e.category).icon, name:catInfo(e.category).name, color:catInfo(e.category).color, amt:0};
    byKey[k].amt += e.amount;
  });
  agendaCosts.forEach(e=>{
    const k = 'evt-'+e.type;
    const t = evtTypeInfo(e.type);
    byKey[k] = byKey[k] || {icon:t.icon, name:t.name+' (actividad)', color:t.color, amt:0};
    byKey[k].amt += e.cost;
  });
  if(totalCreditos > 0){
    byKey['creditos'] = {icon:'🏦', name:'Créditos y pagos fijos', color:CREDIT_COLOR, amt:totalCreditos};
  }
  const rows = Object.values(byKey).sort((a,b)=>b.amt-a.amt);
  const maxAmt = rows.length ? rows[0].amt : 1;
  const grandTotal = totalGasto || 1;

  const barsHtml = rows.map(r=>{
    const widthPct = Math.max(4, Math.round((r.amt/maxAmt)*100));
    const sharePct = Math.round((r.amt/grandTotal)*100);
    return `<div class="bar-row">
      <div class="bar-top">
        <span class="bar-label">${r.icon} ${r.name}</span>
        <span class="bar-amt">${fmt(r.amt)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${widthPct}%; background:${r.color}"></div></div>
      <div class="bar-pct">${sharePct}% del gasto total del mes</div>
    </div>`;
  }).join('') || '<div class="empty">Todavía no hay gastos este mes para graficar.</div>';

  const topRow = rows[0];

  return `
    ${alert}
    <div class="section-title">Tu sueldo mensual</div>
    <div class="salary-row">
      <input type="number" id="inp-salary" placeholder="Ej: 800000" inputmode="numeric" value="${salary>0?salary:''}">
      <button onclick="saveSalary()">Guardar</button>
    </div>

    <div class="section-title">¿Cuánto querés ahorrar?</div>
    <div class="salary-row">
      <div class="pct-input-wrap">
        <input type="number" id="inp-goal" placeholder="20" inputmode="numeric" min="0" max="100" value="${goalPct}">
        <span class="pct-suffix">%</span>
      </div>
      <button onclick="saveSavingsGoal()">Guardar</button>
    </div>
    <div class="goal-hint">Es un porcentaje de tu sueldo · meta actual: ahorrar el <strong>${goalPct}%</strong> por mes</div>

    ${salary>0 ? `
    <div class="cat-grid" style="margin-bottom:16px;">
      <div class="cat-row"><div class="name">💼 Sueldo mensual</div><div class="amt">${fmt(salary)}</div></div>
      <div class="cat-row" style="background:var(--success-bg);"><div class="name" style="color:var(--success); font-weight:600;">🏦 Meta de ahorro (${goalPct}%)</div><div class="amt" style="color:var(--success);">${fmt(goalAmt)}</div></div>
      <div class="cat-row"><div class="name">🛒 Disponible para gastar</div><div class="amt">${fmt(disponibleParaGastar)}</div></div>
    </div>` : ''}

    <div class="stats">
      <div class="stat">
        <div class="label">Gastado este mes</div>
        <div class="value">${fmt(totalGasto)}</div>
      </div>
      <div class="stat ${ahorro<0?'over':(salary>0?'positive':'')}">
        <div class="label">Ahorro real</div>
        <div class="value">${salary>0?fmt(ahorro):'—'}</div>
      </div>
    </div>
    ${salary>0 ? `<div class="stat" style="margin-bottom:16px;">
      <div class="label">${pctGasto}% del sueldo gastado · meta: ahorrar ${goalPct}% (${fmt(goalAmt)}) ${onTrack ? '✅ vas bien' : ''}</div>
      <div class="budget-bar"><div class="budget-fill ${ahorro<0?'over':(!onTrack?'warn':'good')}" style="width:${Math.min(100,pctGasto)}%"></div></div>
    </div>` : ''}

    <div class="section-title">Gasto total del mes</div>
    <div class="cat-grid" style="margin-bottom:16px;">
      <div class="cat-row"><div class="name">💳 Gastos diarios</div><div class="amt">${fmt(totalExp)}</div></div>
      <div class="cat-row"><div class="name">🎒 Actividades extracurriculares</div><div class="amt">${fmt(totalAgenda)}</div></div>
      <div class="cat-row"><div class="name">🏦 Créditos y pagos fijos</div><div class="amt">${fmt(totalCreditos)}</div></div>
      <div class="cat-row" style="background:var(--accent-bg);"><div class="name" style="color:var(--accent); font-weight:600;">Total</div><div class="amt" style="color:var(--accent);">${fmt(totalGasto)}</div></div>
    </div>

    <div class="section-title">Dónde se va la plata</div>
    ${topRow ? `<div class="alert-banner warn" style="margin-bottom:12px;">💡 ${topRow.icon} ${topRow.name} es donde más gastás — ahí hay más margen para ahorrar.</div>` : ''}
    <div class="bars">${barsHtml}</div>

    <div class="section-title">Cotizaciones</div>
    ${renderMarketSection()}
    <div class="alert-banner warn">💡 Tu ahorro no tiene por qué quedarse solo en pesos: podés diversificarlo en dólares, criptomonedas u otras monedas para protegerlo de la inflación. Esto es información general, no una recomendación financiera — evaluá los riesgos antes de invertir.</div>
  `;
}

function renderMarketSection(){
  const usdHtml = market.usd
    ? `<div class="market-row">
        <div class="market-name">💵 Dólar blue</div>
        <div class="market-price">
          <div class="p">Compra ${fmt(market.usd.compra)}</div>
          <div class="p" style="font-weight:500;">Venta ${fmt(market.usd.venta)}</div>
        </div>
      </div>`
    : `<div class="market-row"><div class="empty" style="padding:10px 0;">${market.loading ? 'Cargando dólar...' : 'No se pudo cargar el dólar.'}</div></div>`;

  const cryptoHtml = market.crypto.length
    ? market.crypto.map(c=>{
        const chg = c.price_change_percentage_24h ?? 0;
        const chgClass = chg >= 0 ? 'up' : 'down';
        return `<div class="market-row">
          <div class="market-name"><img src="${c.image}" alt=""> ${c.name}</div>
          <div class="market-price">
            <div class="p">${fmtUsd(c.current_price)}</div>
            <div class="chg ${chgClass}">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(1)}% (24h)</div>
          </div>
        </div>`;
      }).join('')
    : `<div class="market-row"><div class="empty" style="padding:10px 0;">${market.loading ? 'Cargando criptomonedas...' : 'No se pudieron cargar las criptomonedas.'}</div></div>`;

  const updatedLabel = market.updatedAt
    ? 'Actualizado ' + new Date(market.updatedAt).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
    : (market.loading ? 'Actualizando...' : '');

  return `
    <div class="market-updated">
      ${market.error ? '<span style="color:var(--danger)">No se pudo conectar</span>' : `<span>${updatedLabel}</span>`}
      <button class="market-refresh" onclick="refreshMarket()">↻ Actualizar</button>
    </div>
    <div class="market-card">${usdHtml}</div>
    <div class="market-card">${cryptoHtml}</div>
  `;
}
function saveSavingsGoal(){
  const el = document.getElementById('inp-goal');
  const n = parseFloat(el.value);
  if(!isNaN(n) && n >= 0 && n <= 100){
    state.savingsGoalPct = n; saveData(); render();
  } else {
    el.style.borderColor = 'var(--danger)';
  }
}
function saveSalary(){
  const el = document.getElementById('inp-salary');
  const n = parseFloat(el.value);
  if(!isNaN(n) && n >= 0){
    state.salary = n; saveData(); render();
  } else {
    el.style.borderColor = 'var(--danger)';
  }
}

/* ---------- Shared modal helpers ---------- */
function closeModal(){ modalOpen = null; render(); }
function closeModalBg(e){ if(e.target.classList.contains('modal-overlay')) closeModal(); }

loadData();
</script>
